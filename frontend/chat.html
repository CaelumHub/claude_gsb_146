<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>协作聊天 · CoBoard 协同白板</title>
<link rel="stylesheet" href="/css/common.css">
<style>
  .chat-layout { display: flex; flex: 1; min-height: 0; }

  /* 左栏: 房间列表 */
  .rooms-pane {
    width: 232px; flex: none; border-right: 1px solid var(--border);
    background: var(--bg-soft); display: flex; flex-direction: column; min-height: 0;
  }
  .rooms-head { padding: 12px 14px; font-weight: 700; font-size: 13.5px; border-bottom: 1px solid var(--border-soft); }
  .rooms-list { flex: 1; overflow-y: auto; padding: 8px; }
  .room-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
    color: var(--text-soft); font-size: 13px; border: 1px solid transparent;
  }
  .room-item:hover { background: var(--bg-hover); }
  .room-item.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .room-item .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-item .online-badge {
    flex: none; font-size: 11px; padding: 0 7px; border-radius: 10px;
    background: var(--bg-elevated); color: var(--green); border: 1px solid var(--border);
  }

  /* 中栏: 消息区 */
  .msg-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .msg-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .msg-head .t { font-weight: 700; font-size: 14.5px; }
  .msg-list { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
  .day-sep { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; color: var(--text-mute); font-size: 11.5px; }
  .day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
  .sys-note { align-self: center; font-size: 11.5px; color: var(--text-mute); background: var(--bg-elevated); padding: 2px 12px; border-radius: 10px; margin: 4px 0; }
  .msg-row { display: flex; gap: 9px; align-items: flex-start; max-width: 76%; margin-top: 6px; }
  .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg-meta { font-size: 11px; color: var(--text-mute); margin-bottom: 2px; display: flex; gap: 8px; }
  .msg-row.mine .msg-meta { justify-content: flex-end; }
  .msg-bubble {
    padding: 8px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.5;
    background: var(--bg-panel); border: 1px solid var(--border-soft);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.mine .msg-bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
  .load-more { align-self: center; margin: 6px 0; }

  .msg-input {
    display: flex; gap: 10px; padding: 12px 16px;
    border-top: 1px solid var(--border); background: var(--bg-panel); align-items: flex-end;
  }
  .msg-input textarea {
    flex: 1; resize: none; height: 42px; max-height: 120px;
    background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13.5px; font-family: inherit; outline: none;
  }
  .msg-input textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .msg-input textarea:disabled { opacity: .5; cursor: not-allowed; }
  .input-hint { font-size: 11px; color: var(--text-mute); padding: 0 16px 8px; background: var(--bg-panel); }

  /* 右栏: 在线成员 */
  .members-pane {
    width: 216px; flex: none; border-left: 1px solid var(--border);
    background: var(--bg-soft); display: flex; flex-direction: column; min-height: 0;
  }
  .members-head { padding: 12px 14px; font-weight: 700; font-size: 13.5px; border-bottom: 1px solid var(--border-soft); }
  .members-list { flex: 1; overflow-y: auto; padding: 8px; }
  .member-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; }
  .member-item:hover { background: var(--bg-hover); }
  .member-item .minfo { flex: 1; min-width: 0; }
  .member-item .mname { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member-item .msub { font-size: 10.5px; color: var(--text-mute); }

  @media (max-width: 900px) { .members-pane { display: none; } }
  @media (max-width: 700px) { .rooms-pane { width: 150px; } }
</style>
</head>
<body>
<div class="wb-page">
  <div class="wb-full chat-layout">
    <aside class="rooms-pane">
      <div class="rooms-head">💬 房间 <span class="small muted" id="room-count"></span></div>
      <div class="rooms-list" id="rooms-list"></div>
    </aside>

    <main class="msg-pane">
      <div class="msg-head">
        <span id="room-title" class="t">选择左侧房间</span>
        <span class="badge" id="room-mode" style="display:none"></span>
        <span class="spacer"></span>
        <span class="conn-badge" id="conn-badge"><span class="dot off"></span><span id="conn-text">未连接</span></span>
      </div>
      <div class="msg-list" id="msg-list">
        <div class="empty-state" id="msg-empty">
          <div class="icon">💬</div>
          <div class="title">协作聊天</div>
          <div>选择一个白板房间, 与在线成员实时沟通</div>
        </div>
      </div>
      <div class="msg-input">
        <textarea id="input" placeholder="输入消息… (Enter 发送, Shift+Enter 换行)" disabled></textarea>
        <button class="btn primary" id="btn-send" disabled>发送</button>
      </div>
      <div class="input-hint" id="input-hint">未连接房间</div>
    </main>

    <aside class="members-pane">
      <div class="members-head">在线成员 <span class="badge green" id="member-count">0</span></div>
      <div class="members-list" id="members-list"></div>
    </aside>
  </div>
</div>

<script type="module">
import { Api } from './js/api.js';
import { BoardSocket } from './js/ws.js';
import {
  avatarHtml, escapeHtml, fmtTime, getMe, initPage, qs, toast,
} from './js/ui.js';

const me = await initPage('chat', { gate: true, title: '协作聊天' });

if (me) main();

async function main() {
  let boards = [];
  let currentBoardId = null;
  let socket = null;
  let myRole = '';
  let messages = [];                 // 当前房间已加载消息(升序)
  const renderedIds = new Set();
  let hasMore = false;
  let loadingOlder = false;
  const members = new Map();         // client_id → presence

  const PAGE_LABEL = {
    editor: '🎨 白板编辑', mindmap: '🧠 思维导图', chat: '💬 聊天', files: '🗂 文件',
    replay: '⏱ 回放', permissions: '🔐 权限', export: '📤 导出', templates: '🧩 模板',
    settings: '⚙️ 设置', index: '📌 列表',
  };
  const ROLE_LABEL = { owner: '所有者', editor: '编辑', commenter: '评论', viewer: '只读' };

  const $list = document.getElementById('msg-list');
  const $input = document.getElementById('input');
  const $send = document.getElementById('btn-send');
  const $hint = document.getElementById('input-hint');

  /* ------------------------------------------------------------ 房间列表 */
  async function loadBoards() {
    const data = await Api.boards.list({ sort: 'updated' });
    boards = data.boards || [];
    document.getElementById('room-count').textContent = boards.length ? `(${boards.length})` : '';
  }

  function renderRooms() {
    const host = document.getElementById('rooms-list');
    host.innerHTML = boards.map((b) => `
      <div class="room-item ${b.id === currentBoardId ? 'active' : ''}" data-id="${b.id}">
        <span>${b.mode === 'mindmap' ? '🧠' : '🎨'}</span>
        <span class="rname">${escapeHtml(b.name)}</span>
        ${b.id === currentBoardId && members.size
          ? `<span class="online-badge">${members.size} 在线</span>` : ''}
      </div>`).join('')
      || '<div class="empty-state small" style="padding:26px 8px">暂无可访问的白板</div>';
    host.querySelectorAll('.room-item').forEach((el) => {
      el.onclick = () => { if (el.dataset.id !== currentBoardId) openRoom(el.dataset.id); };
    });
  }

  /* ------------------------------------------------------------ 消息渲染 */
  function dayLabel(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(Date.now() - 86400_000);
    const key = (x) => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
    if (key(d) === key(today)) return '今天';
    if (key(d) === key(yest)) return '昨天';
    return fmtTime(ts).slice(0, 10);
  }

  function messageEl(msg) {
    if (msg.kind === 'system') {
      const el = document.createElement('div');
      el.className = 'sys-note';
      el.textContent = msg.text;
      return el;
    }
    const mine = msg.user === me.username;
    const row = document.createElement('div');
    row.className = `msg-row${mine ? ' mine' : ''}`;
    row.innerHTML = `
      ${avatarHtml({ display_name: msg.display_name, color: msg.color })}
      <div>
        <div class="msg-meta">
          <span>${escapeHtml(msg.display_name || msg.user || '?')}</span>
          <span>${fmtTime(msg.ts, true).slice(11)}</span>
        </div>
        <div class="msg-bubble">${escapeHtml(msg.text)}</div>
      </div>`;
    return row;
  }

  function nearBottom() {
    return $list.scrollHeight - $list.scrollTop - $list.clientHeight < 90;
  }

  function appendMessage(msg, forceScroll = false) {
    if (!msg || renderedIds.has(msg.id)) return;
    renderedIds.add(msg.id);
    messages.push(msg);
    document.getElementById('msg-empty')?.remove();
    document.querySelector('.load-more')?.remove();
    const last = messages[messages.length - 2];
    if (!last || dayLabel(last.ts) !== dayLabel(msg.ts)) {
      const sep = document.createElement('div');
      sep.className = 'day-sep';
      sep.textContent = dayLabel(msg.ts);
      $list.appendChild(sep);
    }
    const stick = forceScroll || nearBottom() || msg.user === me.username;
    $list.appendChild(messageEl(msg));
    if (stick) $list.scrollTop = $list.scrollHeight;
    if (hasMore) renderLoadMore();
  }

  function addSystemNote(text) {
    document.getElementById('msg-empty')?.remove();
    const el = document.createElement('div');
    el.className = 'sys-note';
    el.textContent = text;
    const stick = nearBottom();
    $list.appendChild(el);
    if (stick) $list.scrollTop = $list.scrollHeight;
  }

  function renderLoadMore() {
    if (document.querySelector('.load-more')) return;
    const btn = document.createElement('button');
    btn.className = 'btn sm load-more';
    btn.textContent = '↑ 加载更早的消息';
    btn.onclick = loadOlder;
    $list.prepend(btn);
  }

  function renderAll() {
    $list.innerHTML = '';
    renderedIds.clear();
    if (!messages.length) {
      $list.innerHTML = `<div class="empty-state" id="msg-empty">
        <div class="icon">🕊</div><div class="title">还没有消息</div><div>说点什么开始讨论吧</div></div>`;
      return;
    }
    let lastDay = '';
    for (const msg of messages) {
      const day = dayLabel(msg.ts);
      if (day !== lastDay) {
        lastDay = day;
        const sep = document.createElement('div');
        sep.className = 'day-sep';
        sep.textContent = day;
        $list.appendChild(sep);
      }
      renderedIds.add(msg.id);
      $list.appendChild(messageEl(msg));
    }
    if (hasMore) renderLoadMore();
    $list.scrollTop = $list.scrollHeight;
  }

  async function loadHistory(boardId) {
    try {
      const data = await Api.chat.list(boardId, { limit: 100 });
      messages = data.messages || [];
      hasMore = !!data.has_more;
      renderAll();
    } catch (err) {
      toast(err.message || '加载聊天记录失败', 'error');
    }
  }

  async function loadOlder() {
    if (!hasMore || loadingOlder || !messages.length) return;
    loadingOlder = true;
    const prevHeight = $list.scrollHeight;
    try {
      const data = await Api.chat.list(currentBoardId, { before: messages[0].ts, limit: 100 });
      hasMore = !!data.has_more;
      messages = [...(data.messages || []), ...messages];
      renderAll();
      $list.scrollTop = $list.scrollHeight - prevHeight;   // 保持阅读位置
    } catch (err) {
      toast(err.message || '加载更早消息失败', 'error');
    } finally {
      loadingOlder = false;
    }
  }

  /* ------------------------------------------------------------ 成员栏 */
  function renderMembers() {
    const host = document.getElementById('members-list');
    document.getElementById('member-count').textContent = members.size;
    host.innerHTML = [...members.values()].map((m) => `
      <div class="member-item">
        ${avatarHtml({ display_name: m.display_name || m.user, color: m.color })}
        <div class="minfo">
          <div class="mname">${escapeHtml(m.display_name || m.user || '?')}${m.user === me.username ? ' <span class="small muted">(我)</span>' : ''}</div>
          <div class="msub">${escapeHtml(ROLE_LABEL[m.role] || m.role || '')}${m.page ? ' · ' + (PAGE_LABEL[m.page] || m.page) : ''}</div>
        </div>
        <span class="dot on"></span>
      </div>`).join('')
      || '<div class="small muted" style="padding:14px 10px">暂无其他在线成员</div>';
    renderRooms();     // 刷新当前房间在线数徽标
  }

  /* ------------------------------------------------------------ 连接管理 */
  function setConnBadge(status, extra = {}) {
    const badge = document.getElementById('conn-badge');
    const text = document.getElementById('conn-text');
    const dot = badge.querySelector('.dot');
    const map = {
      open: ['on', '在线'],
      connecting: ['off', '连接中…'],
      reconnecting: ['off', `重连中(#${extra.retry || 1})…`],
      closed: ['off', extra.fatal ? '连接被拒绝' : '离线'],
      idle: ['off', '未连接'],
    };
    const [cls, label] = map[status] || map.idle;
    dot.className = `dot ${cls}`;
    text.textContent = label;
  }

  function updateInputState() {
    const connected = socket && socket.status !== 'closed';
    if (!currentBoardId) {
      $input.disabled = true; $send.disabled = true;
      $hint.textContent = '未连接房间';
      return;
    }
    if (myRole === 'viewer') {
      $input.disabled = true; $send.disabled = true;
      $hint.textContent = '🔒 您在该房间是只读成员, 不能发言(可请所有者在「用户权限」页调整角色)';
      return;
    }
    $input.disabled = false; $send.disabled = false;
    $hint.textContent = connected
      ? `以 @${me.username} 发言 · Enter 发送 · Shift+Enter 换行${socket.status !== 'open' ? ' · 连接恢复中将自动改用 HTTP 发送' : ''}`
      : '连接已断开, 发送将走 HTTP 通道';
  }

  /** 每个页面用独立 client_id, 避免与同白板的编辑器标签页互踢(服务端同 client_id 会顶替旧连接) */
  function chatClientId(boardId) {
    const key = `wb_chat_client_${boardId}`;
    try {
      let id = localStorage.getItem(key);
      if (!id) {
        id = `chat${(crypto?.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Math.random().toString(36).slice(2)).slice(0, 10)}`;
        localStorage.setItem(key, id);
      }
      return id;
    } catch { return `chat${Math.random().toString(36).slice(2, 12)}`; }
  }

  async function openRoom(boardId) {
    if (!boardId) return;
    currentBoardId = boardId;
    const board = boards.find((b) => b.id === boardId);
    document.getElementById('room-title').textContent = board?.name || boardId;
    const modeBadge = document.getElementById('room-mode');
    modeBadge.style.display = board ? '' : 'none';
    modeBadge.textContent = board?.mode === 'mindmap' ? '🧠 思维导图' : '🎨 白板';
    history.replaceState(null, '', `?board=${encodeURIComponent(boardId)}`);

    socket?.close();
    socket = null;
    members.clear();
    messages = [];
    renderedIds.clear();
    hasMore = false;
    myRole = '';
    renderMembers();
    $list.innerHTML = '<div class="empty-state small" style="padding:30px"><div>加载聊天记录…</div></div>';
    renderRooms();
    updateInputState();

    await loadHistory(boardId);

    // persist:false —— 聊天页不发 CRDT 操作, 不触碰编辑器页的补发队列
    socket = new BoardSocket(boardId, { page: 'chat', persist: false, clientId: chatClientId(boardId) });
    socket.on('welcome', (msg) => {
      myRole = msg.role || '';
      members.clear();
      for (const presence of Object.values(msg.clients || {})) {
        members.set(presence.client_id, presence);
      }
      renderMembers();
      updateInputState();
    });
    socket.on('chat', ({ message }) => appendMessage(message));
    socket.on('join', (m) => {
      members.set(m.client_id, { ...m });
      renderMembers();
      addSystemNote(`${m.display_name || m.user} 加入了房间`);
    });
    socket.on('leave', (m) => {
      members.delete(m.client_id);
      renderMembers();
      addSystemNote(`${m.display_name || m.user} 离开了房间`);
    });
    socket.on('cursor', (m) => {
      const prev = members.get(m.client_id) || {};
      members.set(m.client_id, { ...prev, ...m });
      renderMembers();
    });
    socket.on('error', (m) => toast(m.message || '服务器错误', 'warn'));
    socket.on('fatal', ({ code }) => {
      if (code === 4401) toast('登录已过期, 请刷新页面重新登录', 'error');
      else if (code === 4403) toast('您无权访问该白板房间', 'error');
      updateInputState();
    });
    socket.onStatusChange = (status, extra) => { setConnBadge(status, extra); updateInputState(); };
    socket.connect();
  }

  /* ------------------------------------------------------------ 发送 */
  async function send() {
    const text = $input.value.trim();
    if (!text || !currentBoardId) return;
    $input.value = '';
    if (socket?.status === 'open' && socket.sendChat(text)) return;   // 消息经服务端广播回流(含自己)
    // WS 不可用 → HTTP 回退(响应同样带 message, 由 renderedIds 去重)
    try {
      const data = await Api.chat.post(currentBoardId, text);
      appendMessage(data.message, true);
      toast('连接未就绪, 已通过 HTTP 发送', 'info', 1800);
    } catch (err) {
      toast(err.message || '发送失败', 'error');
      $input.value = text;
    }
  }

  $send.onclick = send;
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $input.addEventListener('input', () => {
    $input.style.height = '42px';
    $input.style.height = `${Math.min(120, $input.scrollHeight)}px`;
  });

  window.addEventListener('wb:conn-status', (e) => {
    if (e.detail.boardId === currentBoardId) setConnBadge(e.detail.status, e.detail);
  });

  // 未读说明: 本页只为「当前房间」保持 WS 连接; 其他房间的消息在切换进入时
  // 通过 REST 重新拉取补齐, 不做跨房间实时红点(避免 N 个房间 N 条连接)。

  /* ------------------------------------------------------------ 启动 */
  try {
    await loadBoards();
  } catch (err) {
    toast(err.message || '加载房间列表失败', 'error');
  }
  const wanted = qs('board');
  currentBoardId = (wanted && boards.some((b) => b.id === wanted)) ? wanted
    : (boards[0]?.id || null);
  renderRooms();
  if (currentBoardId) openRoom(currentBoardId);
  else {
    $list.innerHTML = `<div class="empty-state"><div class="icon">🗒</div>
      <div class="title">还没有可聊天的白板</div><div>到「白板列表」页新建一个吧</div></div>`;
    updateInputState();
  }
  setInterval(async () => {
    try { await loadBoards(); renderRooms(); } catch { /* 轮询失败静默 */ }
  }, 30_000);
}
</script>
</body>
</html>
